apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pvc-remediation
  # Tests the three-phase PVC remediation handshake between PodRemediator (infra-operator)
  # and the Galera controller (mariadb-operator).
  #
  # This test simulates PodRemediator's behaviour by manually annotating a Galera PVC with
  # pvc-stuck-on-node and a request-id, then asserts that the Galera controller echoes
  # that request ID as consent-id together with safe-to-delete=true once quorum is sufficient.
  #
  # Prerequisites:
  #   - mariadb-operator with PVC remediation support deployed (podremediator branch)
  #   - Standard Galera prerequisites (osp-secret, storageClass local-storage)
  #   - NAMESPACE env var set to the target namespace (default: openstack)
spec:
  steps:
  - name: Deploy 3-node Galera cluster
    description: Deploy a 3-node Galera cluster and wait for it to be fully ready
    bindings:
    - name: replicas
      value: 3
    try:
    - apply:
        file: ../../common/galera.yaml
    - assert:
        timeout: 300s
        file: ../../common/galera-assert.yaml

  - name: Simulate PodRemediator Phase 1 — annotate PVC as stuck
    description: |
      PodRemediator detects a local PVC on an unhealthy node and sets pvc-stuck-on-node.
      We simulate this by patching the PVC directly so this test runs without a real node failure.
    try:
    - script:
        timeout: 30s
        content: |
          # Annotate the lowest-ordinal Galera PVC as stuck on a worker node.
          # The annotation value (worker-0) is arbitrary for this test — the Galera
          # controller only inspects the key, not the value.
          ${OC_CMD:-oc} patch pvc mysql-db-openstack-galera-0 \
            -n ${NAMESPACE:-openstack} \
            --type=merge \
            -p '{"metadata":{"annotations":{"remediation.openstack.org/pvc-stuck-on-node":"worker-0","remediation.openstack.org/request-id":"test-request-1"}}}'

  - name: Assert Phase 2 — Galera controller grants safe-to-delete consent
    description: |
      The Galera controller's PVC watch fires on the annotation change and
      CheckForStuckPVCRequiringRemediation runs. With 3 replicas available (>= quorum of 2)
      it must set safe-to-delete=true and echo the current request-id as consent-id.
    try:
    - assert:
        timeout: 60s
        file: pvc-safe-to-delete-assert.yaml

  - name: Assert pvcRemediation status reflects stuck PVC with consent granted
    description: |
      After the Galera controller grants consent, status.pvcRemediation must contain
      an entry for the annotated PVC with consentGranted=true and stuckNode=worker-0.
    try:
    - assert:
        timeout: 30s
        resource:
          apiVersion: mariadb.openstack.org/v1beta1
          kind: Galera
          metadata:
            name: openstack
            namespace: (env('NAMESPACE') || 'openstack')
          status:
            pvcRemediation:
              mysql-db-openstack-galera-0:
                stuckNode: worker-0
                consentGranted: true

  - name: Verify annotation cleaned up after node recovery simulation
    description: |
      Simulate node recovery by removing the PodRemediator request and consent annotations
      (what PodRemediator Path A does). Verify that no handshake annotations remain.
    try:
    - script:
        timeout: 30s
        content: |
          # Remove pvc-stuck-on-node to simulate node recovery
          ${OC_CMD:-oc} patch pvc mysql-db-openstack-galera-0 \
            -n ${NAMESPACE:-openstack} \
            --type=json \
            -p='[
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1pvc-stuck-on-node"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1request-id"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1safe-to-delete"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1consent-id"}
            ]'
    - assert:
        timeout: 30s
        file: pvc-annotations-cleared-assert.yaml
    - script:
        timeout: 30s
        content: |
          # pvcRemediation must be absent/null once annotations are gone.
          val=$(${OC_CMD:-oc} get galera openstack -n ${NAMESPACE:-openstack} \
            -o jsonpath='{.status.pvcRemediation}' 2>/dev/null)
          test -z "$val"

  - name: Verify quorum calculation for a single replica
    description: |
      Scale down to a single replica. The quorum formula requires floor(1/2)+1 = 1
      available replica, so consent should be granted when that replica is available.
    bindings:
    - name: replicas
      value: 1
    try:
    - script:
        timeout: 30s
        content: |
          ${OC_CMD:-oc} patch -n ${NAMESPACE:-openstack} galera openstack \
            --type='json' \
            -p='[{"op":"replace","path":"/spec/replicas","value":1}]'
    - assert:
        timeout: 300s
        file: ../../common/galera-assert.yaml
    - script:
        timeout: 30s
        content: |
          ${OC_CMD:-oc} patch pvc mysql-db-openstack-galera-0 \
            -n ${NAMESPACE:-openstack} \
            --type=merge \
            -p '{"metadata":{"annotations":{"remediation.openstack.org/pvc-stuck-on-node":"worker-0","remediation.openstack.org/request-id":"test-request-2"}}}'
    - sleep:
        duration: 15s
    - assert:
        timeout: 30s
        file: pvc-safe-to-delete-single-replica-assert.yaml
    finally:
    - script:
        content: |
          ${OC_CMD:-oc} patch pvc mysql-db-openstack-galera-0 \
            -n ${NAMESPACE:-openstack} \
            --type=json \
            -p='[
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1pvc-stuck-on-node"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1request-id"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1safe-to-delete"},
              {"op":"remove","path":"/metadata/annotations/remediation.openstack.org~1consent-id"}
            ]' 2>/dev/null || true
          ${OC_CMD:-oc} patch -n ${NAMESPACE:-openstack} galera openstack \
            --type='json' \
            -p='[{"op":"replace","path":"/spec/replicas","value":3}]'
